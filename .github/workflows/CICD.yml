
name: CICD

on:
  workflow_dispatch:

jobs:
  codes:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Clone the code"

  build:
    needs: [codes]
    runs-on: ubuntu-latest
    steps:
      - name: Build using Docker
        run: echo "Building"

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Running test cases
        run: echo "Test the app"

  deploy:
    needs: [build,test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying on the machine
        run: echo "Deploy on the machine"
