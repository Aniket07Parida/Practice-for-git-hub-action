# This is a Docker install and setup
name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:
    

jobs:
  build-run-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: 
          push: true
          tags: aniketparida158088/my-python-app:latest

